
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>🔐 Password Generator</h1>
        <p>Create a strong random password</p>

        <div class="password-box">
            <input type="text" id="password"
                   placeholder="Your password" readonly>
            <button onclick="copyPassword()">Copy</button>
        </div>

        <label for="length">Password Length:</label>
        <input type="number" id="length" value="12" min="4" max="50">

        <div class="options">
            <label><input type="checkbox" id="uppercase" checked> Uppercase (A-Z)</label>
            <label><input type="checkbox" id="lowercase" checked> Lowercase (a-z)</label>
            <label><input type="checkbox" id="numbers" checked> Numbers (0-9)</label>
            <label><input type="checkbox" id="symbols" checked> Symbols (!@#)</label>
        </div>

        <button class="generate-btn" onclick="generatePassword()">
            Generate Password
        </button>

        <p id="message"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
